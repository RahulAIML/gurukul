<svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- GURUKUL ILLUSTRATION SYSTEM — goals/goal-build-muscle
       Broad shoulders, tight waist, arms flexed. Growth is carried by the
       body proportions themselves plus two rising chevrons, not by a
       dumbbell icon bolted on. -->

  <line x1="34" y1="142" x2="126" y2="142" stroke="var(--ill-neutral)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- rising chevrons: growth, kept behind the subject -->
  <path d="M112 58 L122 48 L132 58" stroke="var(--ill-neutral)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <path d="M112 72 L122 62 L132 72" stroke="var(--ill-neutral)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- legs -->
  <path d="M71 78 L70 110 L70.5 139" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
  <path d="M89 78 L90 110 L89.5 139" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>

  <!-- flexed arms: shoulder → elbow out → fist up -->
  <path d="M52 40 L40 58" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
  <path d="M40 58 L47 34" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
  <path d="M108 40 L120 58" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
  <path d="M120 58 L113 34" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>

  <!-- torso, wider shoulders and a tighter waist than people-neutral -->
  <path d="M51 38 C50 48 64 58 63.5 66 C63 72 60 75 60 80 L100 80 C100 75 97 72 96.5 66 C96 58 110 48 109 38 C102 32 93 30 80 30 C67 30 58 32 51 38 Z" fill="currentColor"/>

  <!-- definition: pectoral shelf + centre line -->
  <path d="M62 44 Q80 52 98 44" stroke="#000000" stroke-opacity="0.26" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="80" y1="52" x2="80" y2="72" stroke="#000000" stroke-opacity="0.26" stroke-width="2.6" stroke-linecap="round"/>

  <rect x="76" y="21" width="8" height="10" fill="currentColor"/>
  <ellipse cx="80" cy="16" rx="7" ry="8.4" fill="currentColor"/>

  <path d="M53 40 C52.5 48 64.5 58 64 65" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="2.4" stroke-linecap="round"/>
</svg>
