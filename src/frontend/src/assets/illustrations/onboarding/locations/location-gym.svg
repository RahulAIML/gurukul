<svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- GURUKUL ILLUSTRATION SYSTEM — locations/location-gym
       An environment, not an object: the rack is drawn as neutral structure
       and the loaded bar carries the accent, so the eye lands on the thing
       you train with. Strict front elevation, as every illustration is. -->

  <line x1="24" y1="142" x2="136" y2="142" stroke="var(--ill-neutral)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- rack uprights + base -->
  <path d="M42 142 V38" stroke="var(--ill-neutral)" stroke-width="7" stroke-linecap="round"/>
  <path d="M118 142 V38" stroke="var(--ill-neutral)" stroke-width="7" stroke-linecap="round"/>
  <path d="M32 142 H52" stroke="var(--ill-neutral)" stroke-width="6" stroke-linecap="round"/>
  <path d="M108 142 H128" stroke="var(--ill-neutral)" stroke-width="6" stroke-linecap="round"/>

  <!-- j-hooks -->
  <path d="M42 62 h9 M118 62 h-9" stroke="var(--ill-neutral)" stroke-width="5" stroke-linecap="round"/>

  <!-- loaded bar: the accent -->
  <rect x="26" y="58" width="108" height="8" rx="4" fill="currentColor"/>
  <rect x="28" y="46" width="9" height="32" rx="3.5" fill="currentColor"/>
  <rect x="123" y="46" width="9" height="32" rx="3.5" fill="currentColor"/>

  <!-- bench, lower and behind -->
  <rect x="58" y="112" width="44" height="8" rx="4" fill="var(--ill-neutral)" opacity="0.75"/>
  <path d="M64 120 v22 M96 120 v22" stroke="var(--ill-neutral)" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
</svg>
